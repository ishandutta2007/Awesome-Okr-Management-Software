<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }

    @keyframes pulseTarget {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }

    .anim-pulse { transform-origin: 1050px 200px; animation: pulseTarget 4s ease-in-out infinite; }
    .anim-float1 { animation: floatCard1 6s ease-in-out infinite; }
    .anim-float2 { animation: floatCard2 7s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.05">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200 M0 300H1200 M0 350H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M100 0V400 M200 0V400 M300 0V400 M400 0V400 M500 0V400 M600 0V400 M700 0V400 M800 0V400 M900 0V400 M1000 0V400 M1100 0V400" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- DYNAMIC BACKGROUND ELEMENTS -->
  <g class="anim-pulse" opacity="0.4">
    <circle cx="1050" cy="200" r="140" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="8 6" />
    <circle cx="1050" cy="200" r="100" fill="none" stroke="#a855f7" stroke-width="2" />
    <circle cx="1050" cy="200" r="60" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="1050" cy="200" r="15" fill="url(#accentGrad)" />
  </g>

  <g class="anim-float1" transform="translate(820, 60)">
    <rect width="220" height="90" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="20" y="35" class="badge-text" fill="#94a3b8">Q4 STRATEGIC ALIGNMENT</text>
    <text x="20" y="68" font-family="sans-serif" font-weight="700" font-size="24" fill="#38bdf8">94.8%</text>
    <path d="M130 65 L150 55 L170 60 L190 40 L210 45" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <g class="anim-float2" transform="translate(860, 240)">
    <rect width="240" height="100" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="20" y="35" class="badge-text" fill="#94a3b8">KEY RESULT PROGRESS</text>
    <rect x="20" y="55" width="200" height="10" rx="5" fill="rgba(255,255,255,0.1)" />
    <rect x="20" y="55" width="160" height="10" rx="5" fill="url(#accentGrad)" />
    <text x="20" y="85" font-family="sans-serif" font-weight="600" font-size="12" fill="#a7f3d0">✓ 18 of 22 Goals Achieved</text>
  </g>

  <!-- FOREGROUND TEXT & CONTENT -->
  <g transform="translate(70, 75)">
    <rect width="280" height="34" rx="17" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1" />
    <circle cx="20" cy="17" r="6" fill="#10b981" />
    <text x="36" y="22" font-family="sans-serif" font-weight="600" font-size="13" fill="#a5b4fc">CURATED OKR ECOSYSTEM 2026</text>
  </g>

  <text x="70" y="165" class="title">
    Awesome OKR Software
  </text>
  
  <rect x="70" y="185" width="180" height="6" rx="3" fill="url(#accentGrad)" />

  <text x="70" y="235" class="subtitle">
    Top Commercial Platforms &amp; Open-Source Goal Management Tools
  </text>

  <g transform="translate(70, 280)">
    <g transform="translate(0, 0)">
      <rect width="160" height="36" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="16" y="23" class="badge-text">🎯 Objectives &amp; KRs</text>
    </g>

    <g transform="translate(175, 0)">
      <rect width="165" height="36" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="16" y="23" class="badge-text">📊 Strategy Alignment</text>
    </g>

    <g transform="translate(355, 0)">
      <rect width="160" height="36" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="16" y="23" class="badge-text">🔓 Self-Hosted Tools</text>
    </g>
  </g>
</svg>
